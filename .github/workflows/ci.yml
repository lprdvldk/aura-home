name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hub tests
        run: |
          python -m pip install -r apps/hub/requirements.txt
          PYTHONPATH=apps/hub pytest apps/hub/tests -q
      - name: DHT11 C++ tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake make
          cmake -S . -B build-agent -DCMAKE_BUILD_TYPE=Release -DSMART_HOUSE_BUILD_DESKTOP=OFF
          cmake --build build-agent --target smarthouse_dht11_tests smarthouse_dht11_agent
          ctest --test-dir build-agent --output-on-failure

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build service and desktop images
        run: |
          docker compose build hub dht11-agent
          docker compose --profile desktop build desktop
      - name: Save images for local load
        run: |
          mkdir -p dist
          docker save aura-home-hub:local aura-home-dht11-agent:local aura-home-desktop:local | gzip > dist/aura-home-images.tar.gz
          docker create --name desktop-bin aura-home-desktop:local
          docker cp desktop-bin:/usr/local/bin/SmartHouse dist/SmartHouse-linux
          docker rm desktop-bin
          docker create --name agent-bin aura-home-dht11-agent:local
          docker cp agent-bin:/usr/local/bin/smarthouse_dht11_agent dist/smarthouse_dht11_agent-linux
          docker rm agent-bin
      - uses: actions/upload-artifact@v4
        with:
          name: aura-home-local-images
          path: dist/
          retention-days: 14
