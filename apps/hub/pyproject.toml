[project]
name = "smarthouse-hub"
version = "0.2.0"
description = "Local smart-house hub: FastAPI + gRPC control plane and WebSocket telemetry."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "websockets>=14.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "cryptography>=43.0",
  "grpcio>=1.68",
  "grpcio-tools>=1.68",
  "protobuf>=5.29",
]

[project.scripts]
smarthouse-hub = "smarthouse_hub.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["smarthouse_hub*"]

[tool.setuptools.package-data]
smarthouse_hub = ["dashboard.html", "pages/*", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
